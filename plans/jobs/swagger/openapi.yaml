openapi: 3.0.3
info:
  title: Cocpit Jobs API
  description: API for managing the lifecycle of Job postings, from Draft to Active to Closed.
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /jobs:
    get:
      summary: List Jobs
      description: Retrieve a paginated list of jobs based on status, org_id, and other filters.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, UNDER_REVIEW, ACTIVE, PAUSED, CLOSED, EXPIRED, REJECTED, ARCHIVED]
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Search keyword
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
    post:
      summary: Create Draft
      description: Initializes a new job in DRAFT status. Requires minimal payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                org_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
                
  /jobs/{id}:
    get:
      summary: Get Job
      description: Retrieve a specific job by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    patch:
      summary: Update Draft
      description: Perform a partial update on a job. Only applies basic schema validation, no business validation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdatePayload'
      responses:
        '200':
          description: Job updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    delete:
      summary: Delete Draft
      description: Permanently delete a DRAFT job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
          
  /jobs/{id}/submit:
    post:
      summary: Submit Job
      description: Enforces strict business validation and transitions status from DRAFT to UNDER_REVIEW.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job submitted successfully
        '422':
          description: Business validation failed
          
  /jobs/{id}/clone:
    post:
      summary: Clone Job
      description: Duplicates an existing job into a new DRAFT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Cloned draft created
          
  /jobs/{id}/pause:
    post:
      summary: Pause Job
      description: Transitions an ACTIVE job to PAUSED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job paused successfully

  /jobs/{id}/close:
    post:
      summary: Close Job
      description: Transitions an ACTIVE or PAUSED job to CLOSED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job closed successfully

  /jobs/{id}/archive:
    post:
      summary: Archive Job
      description: Transitions any job to ARCHIVED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job archived successfully

  /jobs/{id}/approve:
    post:
      summary: Approve Job
      description: Transitions an UNDER_REVIEW job to ACTIVE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job approved successfully

  /jobs/{id}/reject:
    post:
      summary: Reject Job
      description: Transitions an UNDER_REVIEW job to REJECTED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job rejected successfully
          
  /jobs/{id}/ai/actions:
    post:
      summary: AI Action Trigger
      description: Apply generative AI updates to a draft and record provenance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - updates
              properties:
                action:
                  type: string
                  description: The AI action performed (e.g. 'generate_description')
                updates:
                  $ref: '#/components/schemas/JobUpdatePayload'
      responses:
        '200':
          description: AI action applied successfully
          
components:
  schemas:
    Job:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [DRAFT, UNDER_REVIEW, ACTIVE, PAUSED, CLOSED, EXPIRED, REJECTED, ARCHIVED]
        org_id:
          type: string
          format: uuid
        recruiter_id:
          type: string
          format: uuid
        description:
          type: string
        location:
          type: string
        salary_min:
          type: integer
        salary_max:
          type: integer
        experience_min:
          type: integer
        experience_max:
          type: integer
        experience_label:
          type: string
        work_mode:
          type: string
          enum: [Remote, Hybrid, Onsite]
        job_type:
          type: string
        created_at:
          type: string
          format: date-time
          
    JobUpdatePayload:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        salary_min:
          type: integer
        salary_max:
          type: integer
        experience_min:
          type: integer
        experience_max:
          type: integer
        experience_label:
          type: string
        work_mode:
          type: string
          enum: [Remote, Hybrid, Onsite]
        job_type:
          type: string