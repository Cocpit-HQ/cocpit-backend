name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Restart PM2
        shell: powershell
        run: |
          # 1. Navigate to your app folder
          cd "C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend"
          
          # 2. Get latest changes from GitHub
          git pull origin main
          
          # 3. Install fresh dependencies
          npm install --production
          
          # 4. Restart the app
          pm2 reload cocpit-backend --update-env || pm2 start src/server.js --name cocpit-backend