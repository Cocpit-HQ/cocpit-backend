name: Deploy Backend

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        shell: powershell
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            echo "DEST=C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend-prod" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-backend-prod" >> $env:GITHUB_ENV
          } else {
            echo "DEST=C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend-staging" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-backend-staging" >> $env:GITHUB_ENV
          }

      - name: Sync and Restart PM2
        shell: powershell
        run: |
          $destPath = "${{ env.DEST }}"
          
          # robocopy exits with codes 1-7 on success (files copied/skipped/extras).
          # PowerShell treats any non-zero exit as failure, so we suppress it explicitly.
          robocopy . "$destPath" /MIR /XF .env /XD .git node_modules _work
          if ($LASTEXITCODE -gt 7) {
              Write-Error "robocopy failed with exit code $LASTEXITCODE"
              exit 1
          }
          
          cd "$destPath"
          
          npm ci --omit=dev
          
          pm2 reload $env:PM2_NAME --update-env
          if ($LASTEXITCODE -ne 0) {
              pm2 start src/server.js --name $env:PM2_NAME
          }