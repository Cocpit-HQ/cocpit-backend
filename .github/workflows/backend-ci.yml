name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync and Restart PM2
        shell: powershell
        run: |
          # 1. Define destination path
          $destPath = "C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend"
          
          # 2. Sync files (ONLY ONE COMMAND NEEDED)
          # This mirrors the folder but PROTECTS the .env file from deletion
          robocopy . "$destPath" /MIR /XF .env /XD .git node_modules _work
          
          # 3. Navigate to Desktop folder
          cd "$destPath"
          
          # 4. Update dependencies
          npm install --production
          
          # 5. Restart PM2 with PowerShell-safe logic
          pm2 reload cocpit-backend --update-env
          if (-not $?) {
              pm2 start src/server.js --name cocpit-backend
          }