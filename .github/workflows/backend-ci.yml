name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync and Restart PM2
        shell: powershell
        run: |
          # 1. Define paths
          $sourcePath = "$PSCommandPath\..\" # This is where GitHub just downloaded the files
          $destPath = "C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend"
          
          # 2. Copy files from Runner folder to Desktop folder
          # We use /MIR to mirror the directory (deletes old, adds new)
          robocopy . "$destPath" /MIR /XD .git node_modules _work

          # 3. Navigate to Desktop folder
          cd "$destPath"
          
          # 4. Update dependencies
          npm install --production
          
          # 5. Restart PM2 with PowerShell-safe logic
          pm2 reload cocpit-backend --update-env
          if (-not $?) {
              pm2 start src/server.js --name cocpit-backend
          }