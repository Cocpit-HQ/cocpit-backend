name: Deploy Backend

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set environment variables
        shell: powershell
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            echo "DEST=C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend-prod" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-backend-prod" >> $env:GITHUB_ENV
          } else {
            echo "DEST=C:\Users\Administrator\Desktop\COCPIT BACKEND\cocpit-backend-staging" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-backend-staging" >> $env:GITHUB_ENV
          }

      - name: Sync files
        shell: powershell
        run: |
          $destPath = "${{ env.DEST }}"
          robocopy . "$destPath" /MIR /XF .env /XD .git node_modules _work
          # robocopy exit codes 0-7 are success/warning states, not errors
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }

      - name: Install dependencies
        shell: powershell
        run: |
          $before = "${{ github.event.before }}"
          $sha    = "${{ github.sha }}"

          # On first push to a new branch, github.event.before is all zeros
          # In that case we have no history to diff, so install unconditionally
          if ($before -eq "0000000000000000000000000000000000000000") {
            Write-Host "First push to branch — no diff available. Running npm install..."
            $depsChanged = $true
          } else {
            try {
              $changed = git diff --name-only $before $sha
              if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }
              $depsChanged = $changed | Select-String "^(package\.json|package-lock\.json)$"
              if ($depsChanged) {
                Write-Host "Dependency files changed:"
                $changed | Select-String "^(package\.json|package-lock\.json)$" | Write-Host
              } else {
                Write-Host "No dependency changes detected. Skipping npm install."
              }
            } catch {
              Write-Host "Unable to determine dependency changes ($_). Running npm install for safety."
              $depsChanged = $true
            }
          }

          if ($depsChanged) {
            Set-Location -Path "${{ env.DEST }}"
            Write-Host "Running npm install in: $(Get-Location)"
            npm install --omit=dev
            if ($LASTEXITCODE -ne 0) {
              Write-Error "npm install failed with exit code $LASTEXITCODE"
              exit 1
            }
            Write-Host "npm install completed successfully."
          }

      - name: Restart PM2
        shell: powershell
        run: |
          pm2 reload $env:PM2_NAME --update-env
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PM2 process not found. Starting fresh..."
            pm2 start "${{ env.DEST }}\src\server.js" --name $env:PM2_NAME
          }