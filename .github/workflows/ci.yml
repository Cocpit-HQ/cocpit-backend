name: Backend CI & Quality Gate

on:
  pull_request:
    branches:
      - main
      - staging
      - uat
  push:
    branches:
      - main
      - staging
      - uat

jobs:
  validate:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier and ESLint for changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          changed_files="$RUNNER_TEMP/cocpit-changed-files"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' \
            '*.json' '*.css' '*.md' '*.yml' '*.yaml' > "$changed_files"
          mapfile -d '' -t files < "$changed_files"

          if ((${#files[@]})); then
            npx prettier --check -- "${files[@]}"
          fi

          lint_files=()
          for file in "${files[@]}"; do
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs) lint_files+=("$file") ;;
            esac
          done

          if ((${#lint_files[@]})); then
            npx eslint -- "${lint_files[@]}"
          fi

      - name: Syntax Check
        run: |
          node -c src/server.js
          node -c src/gateway.js
          node -c src/admin.server.js
          node -c src/app.js

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: 'test-access-secret'
          JWT_REFRESH_SECRET: 'test-refresh-secret'
        run: npm test -- --passWithNoTests --forceExit

  container:
    name: Container Build Dry-Run
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cocpit-backend:ci-test
