name: Backend CI & Quality Gate

on:
  pull_request:
    branches:
      - main
      - staging
      - uat
  push:
    branches:
      - main
      - staging
      - uat

jobs:
  validate:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax Check
        run: |
          node -c src/server.js
          node -c src/gateway.js
          node -c src/admin.server.js
          node -c src/app.js

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: "test-access-secret"
          JWT_REFRESH_SECRET: "test-refresh-secret"
        run: npm test -- --passWithNoTests --forceExit

  container:
    name: Container Build Dry-Run
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cocpit-backend:ci-test

