# Railway config-as-code for the backend monolith (Main API + Admin API + Socket.IO + workers).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Keep at 1: cron workers run in-process (setInterval) and would run once per replica.
numReplicas = 1
